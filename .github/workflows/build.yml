name: Build 6-IMU EtherCAT Master

on:
  push:
    branches:
      - "feature/6imu-large-pdo"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install workspace dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Verify six-IMU master package
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          test -d install/soem_wrapper
          echo "6-IMU EtherCAT Master build OK"
