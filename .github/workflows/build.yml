name: Build 6-IMU EtherCAT Master

on:
  push:
    branches:
      - "feature/6imu-large-pdo"
      - "feature/6imu-rc-dshot-pdo-v006"
      - "diag/master-loop-stall-profiler-impl"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run master regression contracts
        shell: bash
        run: |
          python3 tests/test_imu_every_pdo_read_policy.py
          python3 tests/test_raw_pdo_gap_diagnostic.py
          python3 tests/test_master_loop_stall_profiler_contract.py
          python3 tests/test_process_pdo_stall_attribution_contract.py

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install workspace dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y

      - name: Validate 6-IMU helper scripts
        shell: bash
        run: |
          bash -n tools/flash_6imu_eeprom.sh
          bash -n tools/prepare_6imu_bringup.sh

          bash tools/prepare_6imu_bringup.sh \
            7654321 \
            lo \
            1 \
            0,2-3

          python3 -m py_compile src/soem_bringup/launch/bringup.launch.py
          grep -q 'sn7654321' src/soem_bringup/config/config.yaml
          grep -q 'sdo_len: !uint16_t 85' src/soem_bringup/config/config.yaml
          grep -q 'task_count: !uint8_t 6' src/soem_bringup/config/config.yaml
          grep -q 'pdoread_offset: !uint16_t 105' src/soem_bringup/config/config.yaml
          grep -q "get_package_share_directory('soem_bringup')" src/soem_bringup/launch/bringup.launch.py
          grep -q "'interface': 'lo'" src/soem_bringup/launch/bringup.launch.py

          echo "6-IMU soem_bringup helper validation OK"

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Verify six-IMU master and bringup packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash

          test -d install/soem_wrapper
          test -d install/soem_bringup
          test -f install/soem_bringup/share/soem_bringup/config/config.yaml
          test -f install/soem_bringup/share/soem_bringup/launch/bringup.launch.py

          ros2 pkg prefix soem_wrapper
          ros2 pkg prefix soem_bringup

          echo "Final launch command:"
          echo "  ros2 launch soem_bringup bringup.launch.py"
          echo "6-IMU EtherCAT Master build OK"
