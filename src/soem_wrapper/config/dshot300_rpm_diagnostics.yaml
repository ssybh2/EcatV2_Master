# BENCH ONLY. Requires H750 LAB firmware from feature/dshot300-rpm-diagnostics.
# Do not use with baseline firmware, spinning props or loaded actuators.
# IMPORTANT: leaves original production config.yaml and original 2-task
# dshot300_bidir_lab.yaml unchanged. 3 read-only/cmd tasks total.
slaves:
  - sn4653120:
      sdo_len: !uint16_t 10
      task_count: !uint8_t 3
      latency_pub_topic: !std::string '/ecat/sn4653120/latency'
      tasks:
        - app_1:
            sdowrite_task_type: !uint8_t 17
            sdowrite_connection_lost_write_action: !uint8_t 0x02
            sub_topic: !std::string '/ecat/sn4653120/app1/write'
            pdowrite_offset: !uint16_t 0
            sdowrite_dshot_id: !uint8_t 2
            sdowrite_init_value: !uint16_t 0
        - app_2:
            sdowrite_task_type: !uint8_t 16
            sdowrite_dshot_id: !uint8_t 2
            pdoread_offset: !uint16_t 0
            pub_topic: !std::string '/ecat/sn4653120/app2/rpm'
        - app_3:
            sdowrite_task_type: !uint8_t 18
            sdowrite_dshot_id: !uint8_t 2
            pdoread_offset: !uint16_t 9
            pub_topic: !std::string '/ecat/sn4653120/app3/rpm_diagnostics'
